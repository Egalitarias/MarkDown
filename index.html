<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark" disabled>
<style>
:root{
  --bg:#ffffff;--fg:#1f2328;--muted:#656d76;--border:#d0d7de;--panel:#f6f8fa;--accent:#0969da;--mark:#fff3a3;
  --toolbar:#f6f8fa;
}
:root[data-theme="dark"]{
  --bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--border:#30363d;--panel:#161b22;--accent:#58a6ff;--mark:#5c4b00;
  --toolbar:#161b22;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
#toolbar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--toolbar);border-bottom:1px solid var(--border);flex-wrap:wrap}
#toolbar button{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:14px}
#toolbar button:hover{border-color:var(--accent)}
#toolbar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#toolbar .sp{flex:1}
#title{font-weight:600;font-size:14px;color:var(--muted);max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#search{display:none;gap:4px;align-items:center}
#search.show{display:flex}
#search input{border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:3px 8px;width:180px;font-size:14px}
#count{font-size:12px;color:var(--muted);min-width:48px}
#main{flex:1;display:flex;min-height:0}
#toc{width:260px;overflow:auto;border-right:1px solid var(--border);padding:12px;font-size:14px;background:var(--panel)}
#toc.hide{display:none}
#toc a{display:block;color:var(--muted);text-decoration:none;padding:2px 0;border-left:2px solid transparent;padding-left:8px}
#toc a:hover{color:var(--accent)}
#toc a.active{color:var(--accent);border-left-color:var(--accent);font-weight:600}
#toc .empty{color:var(--muted);font-style:italic}
#editorWrap{flex:1;display:none;min-width:0}
#editorWrap.show{display:block}
#editor{width:100%;height:100%;border:0;border-right:1px solid var(--border);resize:none;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;outline:none;tab-size:2}
#viewer{flex:1;overflow:auto;min-width:0;scroll-behavior:smooth}
#content{max-width:860px;margin:0 auto;padding:24px 32px 80px}
#status{padding:3px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:var(--toolbar);display:flex;gap:16px}
#drop{position:fixed;inset:0;background:rgba(9,105,218,.15);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:28px;z-index:10;pointer-events:none}
body.dragging #drop{display:flex}

/* markdown body */
#content h1,#content h2{border-bottom:1px solid var(--border);padding-bottom:.3em}
#content h1,#content h2,#content h3,#content h4,#content h5,#content h6{margin:1.6em 0 .6em;line-height:1.25;position:relative}
#content h1:first-child{margin-top:0}
#content .anchor{position:absolute;left:-1.1em;opacity:0;text-decoration:none;color:var(--muted)}
#content :is(h1,h2,h3,h4,h5,h6):hover .anchor{opacity:1}
#content a{color:var(--accent)}
#content img{max-width:100%}
#content blockquote{margin:1em 0;padding:0 1em;color:var(--muted);border-left:4px solid var(--border)}
#content table{border-collapse:collapse;display:block;overflow:auto;max-width:100%}
#content th,#content td{border:1px solid var(--border);padding:6px 12px}
#content tr:nth-child(2n){background:var(--panel)}
#content code{font:85% ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--panel);padding:.2em .4em;border-radius:6px}
#content pre{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px;overflow:auto}
#content pre code{background:none;padding:0;font-size:13px}
#content pre code.hljs{background:none;padding:0}
#content .copy{position:absolute;top:6px;right:6px;font-size:12px;padding:2px 8px;border:1px solid var(--border);background:var(--bg);border-radius:6px;cursor:pointer;opacity:0}
#content pre:hover .copy{opacity:1}
#content hr{border:0;border-top:1px solid var(--border);margin:2em 0}
#content li.task{list-style:none;margin-left:-1.4em}
#content li.task input{margin-right:.5em}
#content mark.hit{background:var(--mark);color:inherit;border-radius:2px}
#content mark.hit.cur{outline:2px solid var(--accent)}
#content .welcome{text-align:center;color:var(--muted);margin-top:15vh}

@media (max-width:800px){#toc{display:none}#title{display:none}#content{padding:16px}}
@media print{
  #toolbar,#toc,#editorWrap,#status{display:none!important}
  body,#main{display:block;height:auto}#viewer{overflow:visible}
  :root{--bg:#fff;--fg:#000}
}
</style>
</head>
<body>
<div id="toolbar">
  <button id="bOpen" title="Open file (Ctrl+O)">Open</button>
  <button id="bToc" class="on" title="Toggle outline">Outline</button>
  <button id="bEdit" title="Toggle editor (Ctrl+E)">Edit</button>
  <button id="bFind" title="Find (Ctrl+F)">Find</button>
  <span id="search">
    <input id="q" placeholder="Find…" autocomplete="off">
    <button id="qPrev" title="Previous (Shift+Enter)">↑</button>
    <button id="qNext" title="Next (Enter)">↓</button>
    <span id="count"></span>
  </span>
  <span id="title">Untitled</span>
  <span class="sp"></span>
  <button id="bW" title="Narrow / wide layout">Width</button>
  <button id="bFont" title="Font size">A±</button>
  <button id="bTheme" title="Toggle theme">Theme</button>
  <button id="bSave" title="Save as standalone HTML">Export HTML</button>
  <button id="bPrint" title="Print / save PDF">Print</button>
  <input type="file" id="file" accept=".md,.markdown,.mdown,.txt,text/markdown,text/plain" hidden>
</div>
<div id="main">
  <nav id="toc"></nav>
  <div id="editorWrap"><textarea id="editor" spellcheck="false" placeholder="Write markdown here…"></textarea></div>
  <div id="viewer"><article id="content"></article></div>
</div>
<div id="status"><span id="sWords"></span><span id="sRead"></span><span id="sLines"></span></div>
<div id="drop">Drop a markdown file to open</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const content = $('content'), editor = $('editor'), viewer = $('viewer'), toc = $('toc');
const store = {
  get(k,d){ try{ const v = localStorage.getItem('mdv.'+k); return v===null?d:v }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem('mdv.'+k,v) }catch(e){} }
};
let fileName = store.get('name','Untitled');
let fontSize = +store.get('font',16);
let wide = store.get('wide','0')==='1';

const WELCOME = `# Markdown Viewer

Open a file, **drag and drop** one onto the page, or paste/write markdown with the **Edit** button.

## Features

- Live preview with GitHub-style rendering and syntax highlighting
- Outline sidebar that tracks your position
- Find in document (Ctrl+F)
- Light / dark theme, font size and width controls
- Export to standalone HTML, or print to PDF
- Task lists, tables, footnote-free simple syntax

## Example

| Shortcut | Action |
|----------|--------|
| Ctrl+O   | Open file |
| Ctrl+E   | Toggle editor |
| Ctrl+F   | Find |

\`\`\`js
const greet = name => \`Hello, \${name}!\`;
console.log(greet('world'));
\`\`\`

- [x] Render markdown
- [ ] Write something great
`;

/* ---------- rendering ---------- */
function slugger(){
  const seen = {};
  return t => {
    let s = t.toLowerCase().replace(/<[^>]+>/g,'').replace(/[^\p{L}\p{N}\s-]/gu,'').trim().replace(/\s+/g,'-') || 'section';
    if(seen[s]!=null){ seen[s]++; s += '-'+seen[s]; } else seen[s]=0;
    return s;
  };
}
function render(md){
  const slug = slugger();
  const r = new marked.Renderer();
  r.heading = function(text, level, raw){
    const id = slug(raw);
    return `<h${level} id="${id}"><a class="anchor" href="#${id}">#</a>${text}</h${level}>`;
  };
  r.code = function(code, lang){
    const l = (lang||'').split(/\s/)[0];
    let html;
    if(l && hljs.getLanguage(l)) html = hljs.highlight(code,{language:l}).value;
    else html = hljs.highlightAuto(code).value;
    return `<pre><button class="copy">Copy</button><code class="hljs ${l?'language-'+l:''}">${html}</code></pre>`;
  };
  r.listitem = function(text, task, checked){
    return task ? `<li class="task">${text}</li>` : `<li>${text}</li>`;
  };
  r.checkbox = function(checked){ return `<input type="checkbox" disabled ${checked?'checked':''}> `; };
  marked.setOptions({gfm:true, breaks:false});
  const html = marked.parse(md,{renderer:r});
  content.innerHTML = DOMPurify.sanitize(html,{ADD_ATTR:['target']});
  content.querySelectorAll('a[href^="http"]').forEach(a=>{ a.target='_blank'; a.rel='noopener noreferrer'; });
  buildToc();
  stats(md);
  if($('search').classList.contains('show') && $('q').value) doFind(false);
}
function buildToc(){
  const hs = [...content.querySelectorAll('h1,h2,h3,h4')];
  if(!hs.length){ toc.innerHTML = '<span class="empty">No headings</span>'; return; }
  const min = Math.min(...hs.map(h=>+h.tagName[1]));
  toc.innerHTML = hs.map(h=>`<a href="#${h.id}" data-id="${h.id}" style="padding-left:${8+(+h.tagName[1]-min)*12}px">${h.textContent.replace(/^#/,'')}</a>`).join('');
}
function stats(md){
  const words = (md.match(/\S+/g)||[]).length;
  $('sWords').textContent = words.toLocaleString()+' words';
  $('sRead').textContent = Math.max(1,Math.round(words/220))+' min read';
  $('sLines').textContent = md.split('\n').length+' lines';
}

/* ---------- scroll spy + anchors + copy ---------- */
function spy(){
  const hs = [...content.querySelectorAll('h1,h2,h3,h4')];
  let cur = null;
  const top = viewer.getBoundingClientRect().top + 20;
  for(const h of hs){ if(h.getBoundingClientRect().top <= top) cur = h; else break; }
  toc.querySelectorAll('a').forEach(a=>a.classList.toggle('active', cur && a.dataset.id===cur.id));
}
viewer.addEventListener('scroll', spy, {passive:true});
document.addEventListener('click', e=>{
  const a = e.target.closest('#toc a, #content a[href^="#"]');
  if(a){
    e.preventDefault();
    const el = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
    if(el) el.scrollIntoView({block:'start'});
    return;
  }
  const c = e.target.closest('.copy');
  if(c){
    const txt = c.parentElement.querySelector('code').textContent;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{ c.textContent='Copied'; setTimeout(()=>c.textContent='Copy',1200); }).catch(()=>{ c.textContent='Failed'; setTimeout(()=>c.textContent='Copy',1200); });
  }
});

/* ---------- load / save ---------- */
function setDoc(md, name){
  editor.value = md;
  if(name!=null){ fileName = name; $('title').textContent = name; document.title = name+' – Markdown Viewer'; store.set('name',name); }
  store.set('doc',md);
  render(md);
  spy();
}
function openFile(f){
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => { setDoc(String(rd.result), f.name); viewer.scrollTop = 0; };
  rd.readAsText(f);
}
$('bOpen').onclick = () => $('file').click();
$('file').onchange = e => { openFile(e.target.files[0]); e.target.value=''; };
let dragDepth = 0;
addEventListener('dragenter', e=>{ e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', e=>{ dragDepth--; if(dragDepth<=0){ dragDepth=0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e=>e.preventDefault());
addEventListener('drop', e=>{ e.preventDefault(); dragDepth=0; document.body.classList.remove('dragging'); openFile(e.dataTransfer.files[0]); });

function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('bSave').onclick = () => {
  const css = [...document.styleSheets].map(s=>{ try{ return [...s.cssRules].map(r=>r.cssText).join('\n') }catch(e){ return '' } }).join('\n');
  const theme = document.documentElement.dataset.theme||'light';
  const out = `<!doctype html><html data-theme="${theme}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${fileName.replace(/</g,'&lt;')}</title><style>${css}body{display:block;height:auto}#content{max-width:860px;margin:0 auto;padding:24px 32px}</style></head><body><article id="content">${content.innerHTML}</article></body></html>`;
  download(fileName.replace(/\.[^.]+$/,'')+'.html', out, 'text/html');
};
$('bPrint').onclick = () => print();

/* ---------- editor ---------- */
let t;
editor.addEventListener('input', ()=>{
  clearTimeout(t);
  t = setTimeout(()=>{ store.set('doc',editor.value); render(editor.value); spy(); }, 150);
});
editor.addEventListener('keydown', e=>{
  if(e.key==='Tab'){
    e.preventDefault();
    const s = editor.selectionStart;
    editor.setRangeText('  ', s, editor.selectionEnd, 'end');
    editor.dispatchEvent(new Event('input'));
  }
});
// proportional scroll sync
let syncing = false;
function sync(from, to){
  if(syncing) return; syncing = true;
  const r = from.scrollTop / Math.max(1, from.scrollHeight - from.clientHeight);
  to.scrollTop = r * (to.scrollHeight - to.clientHeight);
  requestAnimationFrame(()=>syncing=false);
}
editor.addEventListener('scroll', ()=>{ if($('editorWrap').classList.contains('show')) sync(editor, viewer); });
viewer.addEventListener('scroll', ()=>{ if($('editorWrap').classList.contains('show') && document.activeElement!==editor) sync(viewer, editor); });
function toggleEdit(){
  const on = $('editorWrap').classList.toggle('show');
  $('bEdit').classList.toggle('on', on);
  store.set('edit', on?'1':'0');
  if(on) editor.focus();
}
$('bEdit').onclick = toggleEdit;

/* ---------- toolbar toggles ---------- */
$('bToc').onclick = () => { const h = toc.classList.toggle('hide'); $('bToc').classList.toggle('on',!h); store.set('toc',h?'0':'1'); };
function applyLayout(){
  content.style.maxWidth = wide ? 'none' : '860px';
  content.style.fontSize = fontSize+'px';
}
$('bW').onclick = () => { wide = !wide; store.set('wide',wide?'1':'0'); applyLayout(); };
$('bFont').onclick = e => { fontSize = e.shiftKey ? 16 : (fontSize>=22?14:fontSize+2); store.set('font',fontSize); applyLayout(); };
$('bFont').title = 'Font size (click to grow, Shift+click to reset)';
function applyTheme(th){
  document.documentElement.dataset.theme = th;
  $('hljs-light').disabled = th==='dark';
  $('hljs-dark').disabled = th!=='dark';
  store.set('theme',th);
}
$('bTheme').onclick = () => applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* ---------- find ---------- */
let hits = [], hitIdx = -1;
function clearMarks(){
  content.querySelectorAll('mark.hit').forEach(m=>{ const p=m.parentNode; p.replaceChild(document.createTextNode(m.textContent),m); p.normalize(); });
  hits = []; hitIdx = -1;
}
function doFind(jump=true){
  clearMarks();
  const q = $('q').value;
  if(!q){ $('count').textContent=''; return; }
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {acceptNode:n=> n.parentElement.closest('.copy,script,style')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  for(const n of nodes){
    const text = n.nodeValue; re.lastIndex = 0;
    if(!re.test(text)) continue;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m;
    while((m = re.exec(text))){
      frag.append(text.slice(last,m.index));
      const mk = document.createElement('mark'); mk.className='hit'; mk.textContent=m[0]; frag.append(mk); hits.push(mk);
      last = m.index + m[0].length;
    }
    frag.append(text.slice(last));
    n.parentNode.replaceChild(frag,n);
  }
  $('count').textContent = hits.length ? '' : '0 found';
  if(hits.length) go(0, jump);
}
function go(i, scroll=true){
  if(!hits.length) return;
  if(hits[hitIdx]) hits[hitIdx].classList.remove('cur');
  hitIdx = (i+hits.length)%hits.length;
  const h = hits[hitIdx]; h.classList.add('cur');
  if(scroll) h.scrollIntoView({block:'center'});
  $('count').textContent = (hitIdx+1)+' / '+hits.length;
}
function toggleFind(force){
  const s = $('search'), on = force!==undefined?force:!s.classList.contains('show');
  s.classList.toggle('show',on); $('bFind').classList.toggle('on',on);
  if(on){ $('q').focus(); $('q').select(); } else { clearMarks(); $('count').textContent=''; }
}
$('bFind').onclick = () => toggleFind();
$('q').addEventListener('input', ()=>doFind());
$('q').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); go(hitIdx + (e.shiftKey?-1:1)); }
  if(e.key==='Escape') toggleFind(false);
});
$('qNext').onclick = () => go(hitIdx+1);
$('qPrev').onclick = () => go(hitIdx-1);

/* ---------- shortcuts ---------- */
addEventListener('keydown', e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  const k = e.key.toLowerCase();
  if(k==='o'){ e.preventDefault(); $('file').click(); }
  else if(k==='e'){ e.preventDefault(); toggleEdit(); }
  else if(k==='f'){ e.preventDefault(); toggleFind(true); }
});

/* ---------- init ---------- */
(function init(){
  const pref = store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  applyTheme(pref);
  if(store.get('toc','1')==='0'){ toc.classList.add('hide'); $('bToc').classList.remove('on'); }
  applyLayout();
  const saved = store.get('doc', null);
  setDoc(saved!==null ? saved : WELCOME, saved!==null ? fileName : 'Welcome');
  if(store.get('edit','0')==='1') toggleEdit();
  // open #hash target
  if(location.hash){ const el = document.getElementById(decodeURIComponent(location.hash.slice(1))); if(el) el.scrollIntoView(); }
})();
})();
</script>
</body>
</html>
