<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Viewer</title>
<style id="main-style">
:root{
  --bg:#ffffff;--fg:#1f2328;--muted:#656d76;--border:#d0d7de;--panel:#f6f8fa;--accent:#0969da;--mark:#fff3a3;
  --c-kw:#cf222e;--c-str:#0a3069;--c-com:#6e7781;--c-num:#0550ae;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--border:#30363d;--panel:#161b22;--accent:#58a6ff;--mark:#5c4b00;
  --c-kw:#ff7b72;--c-str:#a5d6ff;--c-com:#8b949e;--c-num:#79c0ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 "Segoe UI",system-ui,sans-serif;display:flex;overflow:hidden}
#toc{width:270px;flex:none;overflow:auto;border-right:1px solid var(--border);padding:14px 10px;font-size:13.5px;background:var(--panel)}
body.no-toc #toc{display:none}
#toc .head{font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--muted);margin:0 0 8px 8px}
#toc a{display:block;color:var(--muted);text-decoration:none;padding:3px 8px;border-left:2px solid transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toc a:hover{color:var(--accent)}
#toc a.active{color:var(--accent);border-left-color:var(--accent);font-weight:600}
#toc .empty{color:var(--muted);font-style:italic;padding:3px 8px}
#viewer{flex:1;overflow:auto;min-width:0;position:relative}
#content{max-width:860px;margin:0 auto;padding:28px 36px 90px}
body.wide #content{max-width:none}
#find{position:fixed;top:10px;right:22px;z-index:5;display:none;gap:4px;align-items:center;padding:6px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#find.show{display:flex}
#find input{border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:6px;padding:4px 8px;width:200px;font:14px inherit;outline:none}
#find input:focus{border-color:var(--accent)}
#find button{border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:6px;padding:3px 9px;cursor:pointer}
#find button:hover{border-color:var(--accent)}
#count{font-size:12px;color:var(--muted);min-width:58px;text-align:center}
#empty{text-align:center;color:var(--muted);margin-top:20vh}

#content h1,#content h2{border-bottom:1px solid var(--border);padding-bottom:.3em}
#content :is(h1,h2,h3,h4,h5,h6){margin:1.6em 0 .6em;line-height:1.25;position:relative}
#content > :first-child{margin-top:0}
#content .anchor{position:absolute;left:-1.1em;opacity:0;text-decoration:none;color:var(--muted)}
#content :is(h1,h2,h3,h4,h5,h6):hover .anchor{opacity:1}
#content a{color:var(--accent)}
#content img{max-width:100%}
#content blockquote{margin:1em 0;padding:0 1em;color:var(--muted);border-left:4px solid var(--border)}
#content blockquote.alert{border-left-color:var(--accent);color:var(--fg);background:var(--panel);padding:.4em 1em;border-radius:0 6px 6px 0}
#content blockquote.alert-warning{border-left-color:#bf8700}
#content blockquote.alert-caution{border-left-color:#cf222e}
#content blockquote.alert-tip{border-left-color:#1a7f37}
#content blockquote.alert-important{border-left-color:#8250df}
#content .alert-title{font-weight:600;margin:.2em 0}
#content table{border-collapse:collapse;display:block;overflow:auto;max-width:100%}
#content th,#content td{border:1px solid var(--border);padding:6px 12px}
#content th{background:var(--panel)}
#content tbody tr:nth-child(2n){background:var(--panel)}
#content code{font:85% Consolas,"Cascadia Mono",monospace;background:var(--panel);padding:.2em .4em;border-radius:6px}
#content pre{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px;overflow:auto;line-height:1.45}
#content pre code{background:none;padding:0;font-size:13.5px}
#content pre .copy{position:absolute;top:6px;right:6px;font-size:12px;padding:2px 8px;border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer;opacity:0}
#content pre:hover .copy{opacity:1}
#content pre .lang{position:absolute;top:6px;right:62px;font-size:11px;color:var(--muted);opacity:0}
#content pre:hover .lang{opacity:1}
#content hr{border:0;border-top:1px solid var(--border);margin:2em 0}
#content li.task{list-style:none;margin-left:-1.4em}
#content kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font:85% Consolas,monospace;background:var(--panel)}
#content details{margin:1em 0}
#content summary{cursor:pointer}
#content .footnotes{font-size:.88em;color:var(--muted)}
#content .footnotes hr{margin:2em 0 1em}
#content .footnotes p{margin:.3em 0}
#content .fn-back{text-decoration:none;margin-left:.2em}
#content sup.fn-ref a{text-decoration:none;padding:0 1px}
#content div > :first-child{margin-top:0}
.t-kw{color:var(--c-kw)}.t-str{color:var(--c-str)}.t-com{color:var(--c-com);font-style:italic}.t-num{color:var(--c-num)}
mark.hit{background:var(--mark);color:inherit;border-radius:2px}
mark.hit.cur{outline:2px solid var(--accent)}
@media (max-width:800px){#toc{display:none}#content{padding:18px}}
@media print{
  :root{--bg:#fff;--fg:#000;--panel:#f6f8fa;--border:#ccc;--accent:#0969da;--c-kw:#cf222e;--c-str:#0a3069;--c-com:#6e7781;--c-num:#0550ae}
  #toc,#find,.copy,.lang,.anchor{display:none!important}
  html,body{height:auto;overflow:visible;display:block}
  #viewer{overflow:visible}
  #content{max-width:none;padding:0}
  pre{white-space:pre-wrap}
}
</style>
</head>
<body>
<nav id="toc"></nav>
<div id="viewer"><article id="content"><div id="empty">Open a Markdown file with <kbd>Ctrl</kbd>+<kbd>O</kbd> or drop one here.</div></article></div>
<div id="find">
  <input id="q" placeholder="Find…" autocomplete="off" spellcheck="false">
  <button id="qPrev" title="Previous (Shift+Enter)">&uarr;</button>
  <button id="qNext" title="Next (Enter)">&darr;</button>
  <span id="count"></span>
  <button id="qClose" title="Close (Esc)">&times;</button>
</div>
<script>
(function(){
const $ = id => document.getElementById(id);
const content = $('content'), viewer = $('viewer'), toc = $('toc'), q = $('q');
const post = m => { try { window.chrome.webview.postMessage(m); } catch(e){} };
let docName = '';

/* ---- syntax highlighting ---- */
const KW = new Set(('if else elif for while do switch case default break continue return function def class struct enum union interface ' +
  'namespace using import export from as package public private protected static const let var val fun fn func final new delete this self super ' +
  'try catch except finally throw throws raise async await yield in is not and or null nil none true false True False None void int long short ' +
  'float double char bool boolean string byte unsigned signed auto template typename typedef extern inline virtual override operator ' +
  'select insert update where join group order by limit create table into values set echo then fi done esac local').split(/\s+/));
const HASH = /^(py|python|sh|bash|zsh|shell|yaml|yml|toml|ruby|rb|ps1|powershell|make|makefile|conf|ini|dockerfile|r|perl|pl|cmake)$/;
const DASH = /^(sql|lua|hs|haskell)$/;
function highlight(code, lang){
  lang = (lang||'').toLowerCase();
  if(lang==='json' || lang==='jsonc'){}
  const com = HASH.test(lang) ? '#[^\\n]*' : DASH.test(lang) ? '--[^\\n]*' : lang==='html'||lang==='xml' ? '<!--[\\s\\S]*?-->' : '\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/';
  const re = new RegExp('('+com+')|("(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\'|`(?:\\\\.|[^`\\\\])*`)|(\\b\\d[\\w.]*\\b)|(\\b[A-Za-z_]\\w*\\b)','g');
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let out = '', last = 0, m;
  while((m = re.exec(code))){
    out += esc(code.slice(last, m.index)); last = re.lastIndex;
    if(m[1]) out += '<span class="t-com">'+esc(m[1])+'</span>';
    else if(m[2]) out += '<span class="t-str">'+esc(m[2])+'</span>';
    else if(m[3]) out += '<span class="t-num">'+esc(m[3])+'</span>';
    else if(KW.has(m[4])) out += '<span class="t-kw">'+m[4]+'</span>';
    else out += m[4];
  }
  return out + esc(code.slice(last));
}

/* ---- document ---- */
function slugger(){
  const seen = {};
  return t => {
    let s = t.toLowerCase().trim().replace(/[^\p{L}\p{N}\s-]/gu,'').replace(/\s+/g,'-') || 'section';
    if(seen[s]!=null){ seen[s]++; s += '-'+seen[s]; } else seen[s]=0;
    return s;
  };
}
function setDoc(html){
  const y = viewer.scrollTop;
  clearMarks();
  content.innerHTML = html;
  const slug = slugger();
  content.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h=>{
    h.id = slug(h.textContent);
    const a = document.createElement('a'); a.className='anchor'; a.href='#'+h.id; a.textContent='#';
    h.prepend(a);
  });
  content.querySelectorAll('pre > code').forEach(c=>{
    const m = /language-(\S+)/.exec(c.className);
    c.innerHTML = highlight(c.textContent, m && m[1]);
    const b = document.createElement('button'); b.className='copy'; b.textContent='Copy'; c.parentNode.append(b);
    if(m){ const l = document.createElement('span'); l.className='lang'; l.textContent=m[1]; c.parentNode.append(l); }
  });
  buildToc();
  viewer.scrollTop = y;
  spy();
  if($('find').classList.contains('show') && q.value) doFind(false);
}
function buildToc(){
  const hs = [...content.querySelectorAll('h1,h2,h3,h4')];
  if(!hs.length){ toc.innerHTML = '<div class="head">Outline</div><div class="empty">No headings</div>'; return; }
  const min = Math.min(...hs.map(h=>+h.tagName[1]));
  toc.innerHTML = '<div class="head">Outline</div>' + hs.map(h=>{
    const t = h.textContent.replace(/^#/,'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    return `<a href="#${h.id}" data-id="${h.id}" title="${t}" style="padding-left:${8+(+h.tagName[1]-min)*14}px">${t}</a>`;
  }).join('');
}
function spy(){
  const hs = content.querySelectorAll('h1,h2,h3,h4');
  let cur = null;
  const top = viewer.getBoundingClientRect().top + 30;
  for(const h of hs){ if(h.getBoundingClientRect().top <= top) cur = h; else break; }
  toc.querySelectorAll('a').forEach(a=>{
    const on = !!cur && a.dataset.id===cur.id;
    a.classList.toggle('active', on);
    if(on){ const r=a.getBoundingClientRect(), t=toc.getBoundingClientRect(); if(r.top<t.top||r.bottom>t.bottom) a.scrollIntoView({block:'nearest'}); }
  });
}
viewer.addEventListener('scroll', spy, {passive:true});

document.addEventListener('click', e=>{
  const c = e.target.closest('.copy');
  if(c){
    const txt = c.parentElement.querySelector('code').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>{ c.textContent='Copied'; setTimeout(()=>c.textContent='Copy',1200); }).catch(()=>{ c.textContent='Failed'; setTimeout(()=>c.textContent='Copy',1200); });
    return;
  }
  const a = e.target.closest('a[href]');
  if(!a) return;
  const href = a.getAttribute('href');
  e.preventDefault();
  if(href.startsWith('#')){
    const el = document.getElementById(decodeURIComponent(href.slice(1)));
    if(el) el.scrollIntoView({block:'start'});
  } else {
    post('L:'+href);   // native side opens web links externally and relative .md files in the viewer
  }
});

/* ---- find ---- */
let hits = [], idx = -1;
function clearMarks(){
  content.querySelectorAll('mark.hit').forEach(m=>{ const p=m.parentNode; p.replaceChild(document.createTextNode(m.textContent),m); p.normalize(); });
  hits = []; idx = -1;
}
function doFind(jump=true){
  clearMarks();
  const t = q.value;
  if(!t){ $('count').textContent=''; return; }
  const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  const w = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {acceptNode:n=> n.parentElement.closest('.copy,.lang,.anchor')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes = []; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){
    const text = n.nodeValue; re.lastIndex = 0;
    if(!re.test(text)) continue;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment(); let last = 0, m;
    while((m = re.exec(text))){
      frag.append(text.slice(last,m.index));
      const mk = document.createElement('mark'); mk.className='hit'; mk.textContent=m[0]; frag.append(mk); hits.push(mk);
      last = m.index + m[0].length;
    }
    frag.append(text.slice(last));
    n.parentNode.replaceChild(frag,n);
  }
  $('count').textContent = hits.length ? '' : 'No results';
  if(hits.length) go(0, jump);
}
function go(i, scroll=true){
  if(!hits.length) return;
  if(hits[idx]) hits[idx].classList.remove('cur');
  idx = (i+hits.length)%hits.length;
  const h = hits[idx]; h.classList.add('cur');
  if(scroll) h.scrollIntoView({block:'center'});
  $('count').textContent = (idx+1)+' / '+hits.length;
}
function showFind(on){
  $('find').classList.toggle('show', on);
  if(on){ q.focus(); q.select(); } else { clearMarks(); $('count').textContent=''; }
}
q.addEventListener('input', ()=>doFind());
q.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); go(idx + (e.shiftKey?-1:1)); }
  if(e.key==='Escape') showFind(false);
});
$('qNext').onclick = ()=>go(idx+1);
$('qPrev').onclick = ()=>go(idx-1);
$('qClose').onclick = ()=>showFind(false);

/* ---- keys & wheel ---- */
addEventListener('keydown', e=>{
  if(e.key==='F5'){ e.preventDefault(); post('K:reload'); return; }
  if(e.key==='Escape' && $('find').classList.contains('show')){ showFind(false); return; }
  if(!(e.ctrlKey||e.metaKey)) return;
  const k = e.key.toLowerCase();
  const map = {o:'open', u:'openurl', r:'reload', d:'theme', b:'outline', l:'wide', s:'export', p:'print', '=':'zoomin', '+':'zoomin', '-':'zoomout', '0':'zoomreset'};
  if(k==='f'){ e.preventDefault(); showFind(true); }
  else if(map[k]){ e.preventDefault(); post('K:'+map[k]); }
});
addEventListener('wheel', e=>{
  if(e.ctrlKey){ e.preventDefault(); post('K:'+(e.deltaY<0?'zoomin':'zoomout')); }
}, {passive:false});
addEventListener('contextmenu', e=>{ if(!e.target.closest('#content, #find')) e.preventDefault(); });

/* ---- export ---- */
function exportHtml(){
  clearMarks();
  const css = $('main-style').textContent;
  const theme = document.documentElement.dataset.theme || 'light';
  const body = content.innerHTML.replace(/<button class="copy">.*?<\/button>/g,'');
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return '<!doctype html><html lang="en" data-theme="'+theme+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(docName)+'</title><style>'+css+'body{display:block;overflow:auto;height:auto}#viewer{overflow:visible}</style></head><body class="no-toc"><div id="viewer"><article id="content">'+body+'</article></div></body></html>';
}

/* ---- messages from native ---- */
window.chrome.webview.addEventListener('message', e=>{
  const m = e.data;
  const tag = m.slice(0,2), val = m.slice(2);
  switch(tag){
    case 'D:': setDoc(val); break;
    case 'N:': docName = val; break;
    case 'R:': viewer.scrollTop = 0; break;
    case 'T:': document.documentElement.dataset.theme = val; break;
    case 'O:': document.body.classList.toggle('no-toc', val!=='1'); break;
    case 'W:': document.body.classList.toggle('wide', val==='1'); break;
    case 'F:': showFind(true); break;
    case 'X:': post('X:'+exportHtml()); break;
  }
});
post('ready');
})();
</script>
</body>
</html>
